[project]
name = "kit-the-cat"
version = "0.1.0"
description = "Kit the Cat: pet life-sim engine — genomes & pixel art, 313 life events, roles, battles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
images = ["pillow>=10"]          # encode GIF/PNG (the Telegram bot needs this; the browser build doesn't)
sandbox = ["aiohttp>=3.9"]       # local web sandbox: kit-the-cat

[project.scripts]
kit-the-cat = "kit_the_cat.sandbox.server:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "pillow", "aiohttp"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
