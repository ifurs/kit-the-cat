<title>Kit the Cat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<style>
:root {
  --bg: #f6f1e7; --panel: #fffdf8; --ink: #2b1a26; --muted: #7a6a72; --line: #e3d8c8;
  --accent: #e8618c; --accent-ink: #fff; --good: #3f9b5f; --bad: #d0454c; --warn: #e0a030; --chip: #f2e9da;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1720; --panel: #262029; --ink: #f2e9ee; --muted: #a596a0; --line: #3b3240;
    --accent: #ff7aa4; --accent-ink: #1c1720; --good: #6cc48a; --bad: #ff6f75; --warn: #f0b850; --chip: #322a36;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1720; --panel: #262029; --ink: #f2e9ee; --muted: #a596a0; --line: #3b3240;
  --accent: #ff7aa4; --accent-ink: #1c1720; --good: #6cc48a; --bad: #ff6f75; --warn: #f0b850; --chip: #322a36;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: none; border-color: transparent; }
select, input[type=text], input[type=number] { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; max-width: 100%; }
.muted { color: var(--muted); }
small { font-size: 12.5px; }

header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; margin-right: auto; }
.clock { font-variant-numeric: tabular-nums; }
.menu { position: relative; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 220px; box-shadow: 0 8px 24px #0003; }
.pop[hidden] { display: none; }
.pop label { display: flex; gap: 8px; align-items: center; padding: 4px 2px; }
.pop { max-width: calc(100vw - 24px); }
@media (pointer: coarse) {  /* fingers, not cursors: bigger tap targets */
  button, select { min-height: 40px; }
  .pop label { min-height: 40px; }
  input[type=checkbox] { width: 20px; height: 20px; }
}

main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1100px; margin: 0 auto; }
@media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } }  /* never wider than the screen */
main > * { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.side { align-self: start; position: sticky; top: 12px; }
@media (max-width: 760px) { .side { position: static; } }

.sprite { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 12px; display: block; background: var(--chip); }
.name { font-size: 18px; font-weight: 700; margin: 10px 0 0; }
.meta { color: var(--muted); font-size: 13.5px; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 8px; align-items: center; margin: 12px 0; }
.bar { height: 8px; background: var(--chip); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); transition: width .3s; }
.bar.mid > i { background: var(--warn); } .bar.low > i { background: var(--bad); }
.care { display: flex; gap: 6px; }
.life { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.life .stat { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 13px; white-space: nowrap; }
.life .stat small { color: var(--muted); }
.bet { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.bet input { width: 84px; min-width: 0; }
.care button { flex: 1; font-size: 18px; padding: 8px 0; }
.sub { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg button { font-size: 13.5px; padding: 4px 10px; }
.seg button.on, .tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 300px; overflow: auto; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; }
.row > * { min-width: 0; }
.species { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.species button { padding: 14px 4px; }

.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { position: relative; }
@media (max-width: 520px) { .tabs { display: grid; grid-template-columns: 1fr 1fr; } }  /* 2×2 on phones */
.dot::after { content: ""; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px;
  background: color-mix(in srgb, var(--warn) 20%, transparent); margin-bottom: 12px; flex-wrap: wrap; }

.event-img { width: 100%; image-rendering: pixelated; border-radius: 12px; display: block; background: var(--chip); }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.choices button { text-align: left; padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; }
.result { border-left: 3px solid var(--accent); padding: 8px 12px; margin-top: 12px; background: var(--chip); border-radius: 8px; white-space: pre-wrap; }
.notes { font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--muted); margin-top: 6px; white-space: normal; }
.empty { text-align: center; padding: 26px 10px; }

.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; text-align: center; margin: 10px 0; }
.vs > div { min-width: 0; }  /* sides align at the bottom, so HP bars line up even when one name wraps */
.vs > b { align-self: center; }
.vs div b { display: block; font-size: clamp(13px, 4.2vw, 16px); overflow-wrap: break-word; hyphens: auto; }
.hp { height: 10px; background: var(--chip); border-radius: 6px; overflow: hidden; margin-top: 4px; }
.hp i { display: block; height: 100%; background: var(--good); transition: width .35s; }
.blog { max-height: 240px; overflow: auto; font-size: 13.5px; margin-top: 8px; }
.blog div { padding: 3px 0; border-bottom: 1px dashed var(--line); }
.blog .s1 { color: color-mix(in srgb, var(--accent) 75%, var(--ink)); } .blog .s-1 { color: var(--muted); }
.bracket { display: flex; gap: 10px; overflow-x: auto; padding: 6px 0; }
.bracket .col { min-width: 140px; display: flex; flex-direction: column; justify-content: space-around; gap: 6px; font-size: 13px; }
.match { border: 1px solid var(--line); border-radius: 8px; }
.match div { padding: 2px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.match div + div { border-top: 1px dashed var(--line); }
.match .w { font-weight: 700; } .match .l { color: var(--muted); text-decoration: line-through; }
.champ { text-align: center; font-size: 17px; padding: 10px; border-radius: 12px; background: color-mix(in srgb, var(--warn) 22%, transparent); margin-bottom: 10px; }

.journal div { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.journal time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; font-size: 12.5px; }
.k-twist, .k-role { color: var(--accent); } .k-died { color: var(--bad); font-weight: 600; }

.who { cursor: pointer; flex-direction: column; align-items: stretch; }
.who:hover { border-color: var(--accent); }
.who-head { display: flex; justify-content: space-between; gap: 8px; }
.who-actions { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 6px; }
.zoo { width: 100%; image-rendering: pixelated; border-radius: 12px; margin-top: 10px; }

#loader { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--bg); padding-inline: 16px; }
#loader .box { max-width: 420px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
#loader .paw { font-size: 44px; animation: bob 1.1s ease-in-out infinite; }
#loader ol { text-align: left; margin: 0; padding-left: 22px; color: var(--muted); }
#loader li.now { color: var(--ink); font-weight: 600; } #loader li.done { color: var(--good); }
#loader .err { color: var(--bad); white-space: pre-wrap; }
@keyframes bob { 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { #loader .paw { animation: none; } }
body.busy { cursor: progress; } body.busy #clock::after { content: " · думаю…"; }
canvas.sprite, canvas.event-img, canvas.zoo { max-width: 100%; height: auto; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(520px, calc(100% - 32px));
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; opacity: 0;
  transition: opacity .2s; pointer-events: none; z-index: 30; }
#toast.show { opacity: .96; }
.obit { text-align: left; margin: 8px 0; overflow-wrap: anywhere; }
.obit-title { font-weight: 700; font-style: italic; text-align: center; margin-bottom: 4px; }
.obit-story { margin: 4px 0; padding-left: 18px; font-size: 13px; }
.obit-story li { margin: 2px 0; }
.obit-epitaph { font-style: italic; text-align: center; color: var(--muted); }
</style>

<div id="loader" role="status" aria-live="polite"><div class="box">
  <div class="paw">🐾</div>
  <b>Запускаємо Kit the Cat у твоєму браузері</b>
  <ol><li id="st1">Завантажуємо Python (≈13 МБ, лише першого разу)</li><li id="st2">Розпаковуємо гру: 550+ пригод, генератор спрайтів</li><li id="st3">Відновлюємо збережену гру</li></ol>
  <small class="muted">Усе працює локально: нічого не надсилається на сервер.</small>
  <div class="err" id="loadErr" hidden></div>
</div></div>
<header>
  <h1>🐾 Kit the Cat</h1>
  <span class="clock muted" id="clock"></span>
  <select id="as" aria-label="Грати за"></select>
  <div class="menu">
    <button id="setBtn" aria-haspopup="true" title="Пісочниця">⚙️</button>
    <div class="pop" id="setPop" hidden>
      <button id="npcs">🏘 Заселити 3 сусідів</button>
      <button id="world">🌍 Світова подія</button>
      <button id="theme">🌓 Тема</button>
      <small class="muted" style="padding:2px">Гра зберігається лише в цьому браузері.</small>
      <button id="reset">🧹 Почати спочатку</button>
    </div>
  </div>
</header>

<main lang="uk">
  <aside class="card side" id="pet"></aside>
  <section>
    <div id="worldBanner"></div>
    <nav class="tabs" id="tabs">
      <button data-t="adv">🎲 Пригоди</button><button data-t="arena">🏆 Арена</button>
      <button data-t="nb">🏘 Сусіди</button><button data-t="log">📜 Журнал</button>
    </nav>
    <div class="card" id="view"></div>
  </section>
</main>

<script src="pyodide/pyodide.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let S, L, T, tab = store.get("ks-tab") || "adv", more = "", lastResult = null, battle = null, openNb = 0, busy = false;
const me = () => +($("#as").value || 1);
const strat = () => store.get("ks-strat") || "careful";

function toast(t) { if (!t) return; const el = $("#toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 3500); }
/* ---------- Python (Pyodide) bridge ---------- */
let py = null, bridge = null, queue = Promise.resolve();
const SAVE_KEY = "koshenyat-sandbox-v1";
function serial(fn) { const run = queue.then(fn, fn); queue = run.catch(() => {}); return run; }
async function pyCall(kind, body) {
  return serial(async () => JSON.parse(await bridge.call(kind, me(), body ? JSON.stringify(body) : "{}")));
}
function save() {
  try { localStorage.setItem(SAVE_KEY, bridge.dump()); } catch { /* private mode or quota: the game still works this session */ }
}
async function api(path, body) {
  const kind = {"/api/state": "state", "/api/lists": "lists", "/api/tour": "tour", "/api/do": "do"}[path];
  if (kind !== "do") return pyCall(kind);
  document.body.classList.add("busy");
  // let the "thinking" state paint before Python blocks the page; rAF pauses in background tabs, so cap the wait
  await new Promise(r => { requestAnimationFrame(() => requestAnimationFrame(r)); setTimeout(r, 60); });
  try { const out = await pyCall("do", body); save(); return out; } finally { document.body.classList.remove("busy"); }
}
async function frames(fn, ...args) {
  return serial(async () => {
    const p = await bridge[fn](...args);
    if (!p) return null;
    const js = p.toJs({dict_converter: Object.fromEntries});
    p.destroy();
    return js;
  });
}

/* ---------- pixel art on canvas ---------- */
const players = new Set();
const still = matchMedia("(prefers-reduced-motion: reduce)");
function draw(cv, pack, scale) {
  if (!cv) return;
  if (!pack) { cv.hidden = true; return; }
  const {w, h, labels} = pack;
  cv.width = w * scale; cv.height = h * scale;
  const imgs = pack.frames.map(rgb => {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"), id = g.createImageData(w, h);
    for (let i = 0, j = 0; i < rgb.length; i += 3, j += 4) { id.data[j] = rgb[i]; id.data[j + 1] = rgb[i + 1]; id.data[j + 2] = rgb[i + 2]; id.data[j + 3] = 255; }
    g.putImageData(id, 0, 0); return c;
  });
  cv._anim = {imgs, labels: labels || [], scale, f: 0};
  paintFrame(cv); players.add(cv);
}
function paintFrame(cv) {
  const a = cv._anim, g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.drawImage(a.imgs[a.f], 0, 0, cv.width, cv.height);
  if (!a.labels.length) return;
  g.font = `600 ${Math.round(a.scale * 3.4)}px system-ui, sans-serif`; g.textAlign = "center"; g.lineJoin = "round";
  for (const [t, x, y] of a.labels) {
    g.lineWidth = a.scale; g.strokeStyle = "rgba(20,12,20,.85)"; g.strokeText(t, x * a.scale, y * a.scale);
    g.fillStyle = "#fff"; g.fillText(t, x * a.scale, y * a.scale);
  }
}
setInterval(() => {
  if (still.matches) return;
  for (const cv of players) {
    if (!cv.isConnected) { players.delete(cv); continue; }
    cv._anim.f = (cv._anim.f + 1) % cv._anim.imgs.length; paintFrame(cv);
  }
}, 380);
async function act(action, x, extra = {}) {
  if (busy) return; busy = true;
  try {
    const r = await api("/api/do", {action, x, ...extra});
    if (r.result) { lastResult = r.result.error ? null : r.result; toast(r.result.error); }
    else if (r.battle) { if (r.battle.error) toast(r.battle.error); else if (r.battle.log) battle = r.battle; else if (r.battle.champion) toast("👑 " + r.battle.champion.name); }
    else toast(r.message);
    await refresh();
  } catch (e) { toast("Помилка: " + e.message); } finally { busy = false; }
}
const bar = (icon, v) => `<span>${icon}</span><div class="bar ${v < 25 ? "low" : v < 55 ? "mid" : ""}" title="${v}"><i style="width:${v}%"></i></div><small class="muted">${v}</small>`;

/* ---------- pet card (always visible) ---------- */
function obit(p) {
  const s = p.summary;
  if (!s) return `<p>🪦 ${esc(p.cause)}</p>`;
  const story = s.story.length ? `<div class="muted" style="margin-top:6px">📖 Найяскравіше:</div><ul class="obit-story">${s.story.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  return `<div class="obit"><div class="obit-title">${esc(s.title)}</div><p>⚰️ ${esc(s.cause.charAt(0).toUpperCase() + s.cause.slice(1))}</p>
    ${s.facts.map(x => `<div class="meta">${esc(x)}</div>`).join("")}${story}
    ${s.family ? `<div class="meta">${esc(s.family)}</div>` : ""}${s.epitaph ? `<p class="obit-epitaph">«${esc(s.epitaph)}»</p>` : ""}</div>`;
}

function renderPet() {
  const el = $("#pet"), p = S.pet;
  const speciesGrid = S.species.map(([id, e, n]) => `<button data-sp="${id}">${e}<br><small>${esc(n)}</small></button>`).join("");
  if (!p) el.innerHTML = `<div class="name">Заведи пета</div><p class="muted">Гени, характер і доля випадуть випадково.</p><div class="species">${speciesGrid}</div>`;
  else {
    const tags = [`💰 ${p.money} ₴`, `ур. ${p.level}`, p.rarity, p.role, p.job].filter(Boolean).map(esc).join(" · ");
    let h = `<canvas class="sprite" id="petCv" role="img" aria-label="${esc(p.name)}"></canvas>
      <div class="name">${p.emoji} ${esc(p.name)}</div><div class="meta">${esc(p.stage)} · ${p.years} р. · ${tags}</div>`;
    if (p.state === "egg") h += `<p class="muted">🎭 ${esc(p.persona.temper)} · мріє ${esc(p.persona.dream)}</p><button class="primary" id="hatch" style="width:100%">🐣 Вилупити</button>`;
    if (p.state === "dead") h += `${obit(p)}<button class="primary" id="heir" style="width:100%">🥚 Спадкоємець${p.heir ? " (від пари)" : ""}</button>
      <details style="margin-top:8px"><summary class="muted">або новий рід</summary><div class="species">${speciesGrid}</div></details>`;
    if (p.state === "alive") {
      const s = p.stats;
      const dream = p.dream_done ? `🌟 Мрія збулася: ${esc(p.persona.dream)}` : p.goal_step >= 3 ? `🎯 Мрія лишилася мрією: ${esc(p.persona.dream)}`
        : `🎯 Мрія: ${esc(p.persona.dream)} <span title="крок ${p.goal_step} з 3">${"▰".repeat(p.goal_step)}${"▱".repeat(3 - p.goal_step)}</span>`;
      h += `<div class="meta" style="margin-top:6px" title="Риса характеру діє в кожній пригоді">🎭 ${esc(p.persona.temper)} · ${esc(p.perk)}</div>
        <div class="meta">${dream}</div>
        <div class="bars">${bar("❤️ здоров'я", s.health)}${bar("😊 настрій", s.mood)}</div>
        <div class="life">${[["💪", "сила", "str"], ["🧠", "розум", "int"], ["😎", "харизма", "cha"], ["🍀", "удача", "luck"]].map(([i, n, k]) => `<span class="stat">${i} ${n} ${p.power[k]}</span>`).join("")}</div>
        <div class="meta">${esc(p.money_tier)}</div>
        <div class="life">${p.life.map(l => `<span class="stat" title="${esc(l.tier)}">${l.icon} ${esc(l.name)} ${l.value} <small>${esc(l.tier)}</small></span>`).join("")}</div>
        <div class="care"><button data-care="heal" title="Лікувати">💊</button><button data-more="casino" title="Казино">🎰</button>
          <button data-more="menu" title="Речі, базар, дім, робота…">⋯</button></div>
        <div id="more"></div>`;
    }
    el.innerHTML = h;
  }
  el.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => act("create", b.dataset.sp));
  el.querySelectorAll("[data-care]").forEach(b => b.onclick = () => act("care", b.dataset.care));
  el.querySelectorAll("[data-more]").forEach(b => b.onclick = () => {
    if (b.dataset.more === "casino") more = more === "casino" ? "" : "casino";
    else more = more && more !== "casino" ? "" : "wardrobe";
    renderMore();
  });
  const h = $("#heir"); if (h) h.onclick = () => act("heir");
  const hb = $("#hatch"); if (hb) hb.onclick = () => act("hatch");
  renderMore();
  if (p) frames("pet_frames", S.owner).then(pk => draw($("#petCv"), pk, 6));
}

function renderMore() {
  const el = $("#more"); if (!el) return;
  if (!more) { el.innerHTML = ""; return; }
  const row = (l, r, btn) => `<div class="row"><span>${l}${r ? ` <small class="muted">${r}</small>` : ""}</span>${btn || ""}</div>`;
  const opts = [["wardrobe", "👗 Речі"], ["shop", "🛒 Базар"], ["homes", "🏠 Дім"], ["jobs", "💼 Робота"], ["dna", "🧬 Гени"], ["name", "✏️ Ім'я"]];
  const head = more === "casino" ? "" : `<div class="seg">${opts.map(([k, n]) => `<button data-sec="${k}" class="${more === k ? "on" : ""}">${n}</button>`).join("")}</div>`;
  let list = "";
  if (more === "casino") list = S.pet.casino.length ? S.pet.casino.map(v => `<div class="row"><span>${esc(v.name)} <small class="muted">${v.lo}–${v.hi} ₴</small></span>
      <span class="bet"><input type="number" inputmode="numeric" min="${v.lo}" max="${v.hi}" value="${v.lo}" data-stake="${v.id}"><button data-bet="${v.id}">Ставка</button></span></div>`).join("")
    : `<p class="muted">Казино — лише для дорослих при грошах. Автомати в переході пускають від 20 ₴.</p>`;
  if (more === "wardrobe") list = L.wardrobe.length ? L.wardrobe.map(w => row((w.on ? "✅ " : "") + esc(w.name), "", `<button data-eq="${w.i}">${w.on ? "Зняти" : "Одягти"}</button>`)).join("") : `<p class="muted">Поки порожньо — загляни на базар.</p>`;
  if (more === "shop") list = L.stock.map(x => row(esc(x.name), x.price + " ₴", `<button data-buy="${x.i}">Купити</button>`)).join("");
  if (more === "homes") list = L.homes.map(x => row((x.here ? "📍 " : "") + esc(x.name), "", x.here ? "" : `<button data-mv="${x.i}">Сюди</button>`)).join("");
  if (more === "jobs") list = (S.pet.job ? row("Зараз: " + esc(S.pet.job), "", `<button data-quit>Звільнитися</button>`) : "") +
    (L.jobs.length ? L.jobs.map(j => row(esc(j.name), (j.pay || "??") + " ₴/день", `<button data-job="${j.id}">Спробувати</button>`)).join("") : `<p class="muted">Вакансій нема — підрости або вляпайся в історію.</p>`);
  if (more === "dna") list = `<p class="muted">🧬 ${esc(S.pet.dna)}</p>` + S.pet.genes.map(g => row(esc(g))).join("") +
    row("🦶 Копнути свого пета", "темна сторона", `<button data-care="kick">🦶</button>`);
  if (more === "name") list = `<div class="row"><input type="text" id="newName" maxlength="24" value="${esc(S.pet.name)}" style="flex:1;min-width:0"><button id="saveName">OK</button></div>`;
  el.innerHTML = `<div class="sub">${head}<div class="list">${list}</div></div>`;
  el.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => { more = b.dataset.sec; renderMore(); });
  el.querySelectorAll("[data-bet]").forEach(b => b.onclick = () => act("casino", b.dataset.bet, {stake: +el.querySelector(`[data-stake="${b.dataset.bet}"]`).value}));
  el.querySelectorAll("[data-eq]").forEach(b => b.onclick = () => act("equip", +b.dataset.eq));
  el.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => act("buy", +b.dataset.buy));
  el.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => act("move", +b.dataset.mv));
  el.querySelectorAll("[data-job]").forEach(b => b.onclick = () => act("job", b.dataset.job));
  el.querySelectorAll("[data-care]").forEach(b => b.onclick = () => act("care", b.dataset.care));
  const q = el.querySelector("[data-quit]"); if (q) q.onclick = () => act("quit");
  const sn = $("#saveName"); if (sn) sn.onclick = () => act("rename", $("#newName").value);
}

/* ---------- tabs ---------- */
function renderTabs() {
  const pending = S.pet && S.pet.pending, live = T.tour && T.tour.status === "running";
  $("#tabs").querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", b.dataset.t === tab);
    b.classList.toggle("dot", (b.dataset.t === "adv" && !!pending && tab !== "adv") || (b.dataset.t === "arena" && live && tab !== "arena"));
  });
  const w = S.world;
  $("#worldBanner").innerHTML = w ? `<div class="banner"><span>🌍 <b>${esc(w.title)}</b> <small class="muted">${w.claimed}/${w.n}</small></span>
    <button class="primary" id="claim" ${w.mine || !S.pet || S.pet.state !== "alive" ? "disabled" : ""}>${esc(w.button)}</button></div>` : "";
  const c = $("#claim"); if (c) c.onclick = () => act("claim");
  ({adv: renderAdv, arena: renderArena, nb: renderNb, log: renderLog})[tab]();
}

function resultHtml(r) {
  if (!r) return "";
  const verdict = r.ok === null ? "" : (r.crit === "win" ? "🌟 Критичний успіх" : r.crit === "fail" ? "💥 Критичний провал" : r.ok ? "✅ Успіх" : "❌ Провал");
  const notes = (r.notes || []).concat(r.tail_notes || []);
  return `<div class="result">${r.twist ? "🌀 <b>Сюжетний поворот!</b>\n" : ""}<b>${esc(r.label)}</b>${verdict ? ` — ${verdict} <small class="muted">(🎲 ${r.roll}, шанс ${Math.round(r.chance * 100)}%)</small>` : ""}
${esc(r.text)}${r.tail ? `\n🌀 ${esc(r.tail)}` : ""}${r.died ? `\n⚰️ <b>${esc(r.name)} помер.</b> ${esc(r.cause)}` : ""}${notes.length ? `<div class="notes">${esc(notes.join(" · "))}</div>` : ""}</div>`;
}

function renderAdv() {
  const el = $("#view"), p = S.pet, ev = p && p.pending;
  if (!p || p.state !== "alive") {
    el.innerHTML = `<p class="empty muted">${!p ? "Спершу заведи пета ←" : p.state === "egg" ? "Яйце ще гріється — тисни «🐣 Вилупити» ←" : "Пригоди — для живих 🪦"}</p>`;
    return;
  }
  if (ev) {
    el.innerHTML = `<canvas class="event-img" id="evCv" role="img" aria-label="Сцена пригоди"></canvas>
      <p>${ev.twist ? "🌀 " : ""}${ev.other ? `👥 <b>${esc(ev.other)}</b> · ` : ""}${esc(ev.text)}</p>
      <div class="choices">${ev.choices.map(c => `<button data-ch="${c.i}"><span>${esc(c.label)}</span>${c.chance != null ? `<small class="muted">🎲 ${Math.round(c.chance * 100)}%</small>` : ""}</button>`).join("")}
        <button data-ch="auto" class="ghost muted">Хай вирішить сам</button></div>`;
    frames("event_frames", S.owner).then(pk => draw($("#evCv"), pk, pk && pk.w > 48 ? 4 : 6));
    el.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => act("choose", b.dataset.ch === "auto" ? null : +b.dataset.ch));
    return;
  }
  el.innerHTML = `<div class="empty"><button class="primary" id="go">🎲 Нова пригода</button></div>${resultHtml(lastResult)}`;
  $("#go").onclick = () => { lastResult = null; act("adventure"); };
}

const roundName = n => n === 1 ? "Фінал" : n === 2 ? "Півфінал" : n === 4 ? "Чвертьфінал" : `1/${n}`;
function bracketHtml(t) {
  return `<div class="bracket">${t.rounds.map(r => `<div class="col"><small class="muted">${roundName(r.length)}</small>${r.map(m => {
    const f = x => !x ? `<div class="l">—</div>` : `<div class="${m.winner ? (m.winner === x.owner ? "w" : "l") : ""}">${x.emoji} ${esc(x.name)}</div>`;
    return `<div class="match">${f(m.a)}${f(m.b)}</div>`; }).join("")}</div>`).join("")}</div>`;
}

function renderArena() {
  const el = $("#view");
  if (battle) return renderBattle();
  const t = T.tour, live = t && t.status === "running", c = live && t.current;
  const tactic = `<select id="strat" aria-label="Тактика">${T.strategies.map(([k, n]) => `<option value="${k}" ${(T.my_strategy || strat()) === k ? "selected" : ""}>${n}</option>`).join("")}</select>`;
  const foes = S.players.filter(x => x.owner !== S.owner && x.state === "alive");
  let h = T.me ? `<p class="meta">🏅 Рейтинг ${T.me.elo} · ${T.me.wins} перемог · ${T.me.losses} поразок</p>` : "";
  if (t && t.status === "done" && t.champion) h += `<div class="champ">👑 Чемпіон: ${t.champion.emoji} <b>${esc(t.champion.name)}</b></div>`;
  if (c) {
    const mine = c.a.mine || c.b.mine;
    const myBet = t.rounds.flat().find(m => m.key === c.key)?.my_bet;
    const side = mine ? `Моя тактика: ${tactic}` : myBet ? `<small class="muted">Твоя ставка: ${myBet[1]} ₴ ×${myBet[2]}</small>` : S.pet ?
      `<button data-bet="0">🎰 50 ₴ на ${esc(c.a.name)} ×${c.odds[0]}</button><button data-bet="1">🎰 50 ₴ на ${esc(c.b.name)} ×${c.odds[1]}</button>` : "";
    h += `<div class="vs"><div>${c.a.emoji}<b>${esc(c.a.name)}</b><small class="muted">${Math.round(c.chance * 100)}%</small></div><b>VS</b>
        <div>${c.b.emoji}<b>${esc(c.b.name)}</b><small class="muted">${Math.round((1 - c.chance) * 100)}%</small></div></div>
      <div class="seg" style="justify-content:center">${side}</div>
      <p class="seg" style="justify-content:center"><button class="primary" id="fight">▶️ Бій</button><button id="toEnd">⏭ До фіналу</button></p>
      <details><summary class="muted">Сітка турніру · фонд ${t.prize} ₴</summary>${bracketHtml(t)}</details>`;
  } else if (live) {  // e.g. the next pairing is waiting on a walkover: let the game resolve it
    h += `<div class="empty"><button class="primary" id="fight">▶️ Далі</button><p class="muted">Турнір триває</p></div>`;
  } else {
    h += `<div class="empty"><button class="primary" id="newTour" ${T.eligible < 3 ? "disabled" : ""}>🏆 Почати турнір</button>
      <p class="muted">${T.eligible < 3 ? "Потрібно щонайменше 3 пети-підлітки (⚙️ → сусіди; вони дорослішають, поки ти граєш)" : `бійців готово: ${T.eligible} · приз 300 ₴ за кожного`}</p></div>`;
    if (S.pet && S.pet.state === "alive" && foes.length)
      h += `<div class="row"><span class="seg">⚔️ Спаринг з <select id="foe">${foes.map(f => `<option value="${f.owner}">${f.emoji} ${esc(f.name)}</option>`).join("")}</select></span>
        <span class="seg">${tactic}<button id="spar">Бій</button></span></div>`;
    if (t && t.status === "done") h += `<details style="margin-top:10px"><summary class="muted">Сітка останнього турніру</summary>${bracketHtml(t)}</details>`;
  }
  if (T.history.length) h += `<details style="margin-top:10px"><summary class="muted">Попередні чемпіони</summary>${T.history.map(x => `<div><small>${esc(x)}</small></div>`).join("")}</details>`;
  el.innerHTML = h;
  const st = $("#strat"); if (st) st.onchange = e => { store.set("ks-strat", e.target.value); if (live) act("t_strategy", e.target.value); };
  el.querySelectorAll("[data-bet]").forEach(b => b.onclick = () => act("t_bet", +b.dataset.bet, {key: c.key, amount: 50}));
  const nt = $("#newTour"); if (nt) nt.onclick = async () => { await act("t_new"); act("t_strategy", strat()); };
  const fi = $("#fight"); if (fi) fi.onclick = () => act("t_next");
  const te = $("#toEnd"); if (te) te.onclick = toEnd;
  const sp = $("#spar"); if (sp) sp.onclick = () => act("spar", strat(), {with: +$("#foe").value});
}

async function toEnd() {
  if (busy) return; busy = true;
  let last = null;
  try {
    for (let i = 0; i < 40; i++) {
      const r = (await api("/api/do", {action: "t_next"})).battle;
      if (r && r.log) last = r;
      if (!r || r.error || r.done || r.champion) break;
    }
  } finally { busy = false; }
  battle = last ? Object.assign(last, {fast: true}) : null;
  await refresh();
}

function renderBattle() {
  const el = $("#view"), r = battle;
  const [fa, fb] = r.fighters;
  el.innerHTML = `<canvas class="event-img" id="fightCv" role="img" aria-label="Бій"></canvas>
    <div class="vs">${[fa, fb].map((f, i) => `<div><b>${esc(f.name)}</b><small class="muted">${esc(f.strategy)}</small><div class="hp"><i id="hp${i}" style="width:100%"></i></div></div>`).join("<b>VS</b>")}</div>
    <div class="blog" id="blog"></div><div id="bEnd"></div>`;
  frames("fight_frames", r.owners[0], r.owners[1]).then(pk => draw($("#fightCv"), pk, 4));
  play(r);
}

async function play(r) {
  const log = $("#blog"), [fa, fb] = r.fighters, fast = r.fast || r.played;
  for (const e of r.log) {
    if (!log.isConnected) return;
    const d = document.createElement("div"); d.className = "s" + e.side; d.textContent = e.text; log.appendChild(d); log.scrollTop = log.scrollHeight;
    [fa, fb].forEach((f, i) => $("#hp" + i).style.width = Math.max(0, e.hp[i] / f.max_hp * 100) + "%");
    if (!fast) await new Promise(res => setTimeout(res, 420));
  }
  if (!log.isConnected) return;
  r.played = true;
  const bets = (r.bets || []).length ? `<div class="notes">Ставки: ${esc(r.bets.join(" · "))}</div>` : "";
  $("#bEnd").innerHTML = `<div class="result">🏆 ${esc(r.text)}${r.champion ? `\n👑 <b>Чемпіон турніру: ${esc(r.champion.name)}!</b>` : ""}${bets}</div>
    <p class="seg" style="justify-content:center;margin-top:10px">${T.tour && T.tour.status === "running" ? `<button class="primary" id="nextFight">▶️ Наступний бій</button>` : ""}<button id="back">← Арена</button></p>`;
  const nf = $("#nextFight"); if (nf) nf.onclick = () => { battle = null; act("t_next"); };
  $("#back").onclick = () => { battle = null; renderArena(); };
}

function renderNb() {
  const el = $("#view");
  const st = {friend: "🤝 друг", bestie: "💛 бестік", rival: "😤 суперник", enemy: "⚔️ ворог", crush: "😳 закоханість", partner: "💍 пара", ex: "💔 колишній"};
  const others = S.players.filter(x => x.owner !== S.owner);
  if (!others.length) {
    el.innerHTML = `<div class="empty muted">Поруч нікого.<br><br><button id="addNb">🏘 Заселити 3 сусідів</button></div>`;
    $("#addNb").onclick = () => act("npcs", 3);
    return;
  }
  const can = S.pet && S.pet.state === "alive";
  el.innerHTML = `<p class="muted" style="margin:0 0 6px">Натисни на сусіда, щоб взаємодіяти.</p>
    <div class="list" style="max-height:none">${others.map(x => `<div class="row who" data-nb="${x.owner}">
      <div class="who-head"><span>${x.emoji} <b>${esc(x.name)}</b> <small class="muted">${esc(x.owner_name)} · ${esc(x.stage)}${x.state === "dead" ? " · 🪦" : ""}</small></span>
      <small>${x.status ? st[x.status] : ""}${x.rel ? ` ${x.rel > 0 ? "+" : ""}${x.rel}` : ""}</small></div>
      ${openNb === x.owner && can && x.state === "alive" ? `<div class="who-actions"><button data-a="pat">🤗 Погладити</button><button data-a="kick">🦶 Копнути</button>
        <button data-a="date">💌 Побачення</button><button data-a="fight">🥊 Сварка</button><button data-a="spar">⚔️ Спаринг</button></div>` : ""}</div>`).join("")}</div>
    <p style="text-align:center"><button id="zooBtn">🦁 Груповий портрет</button></p><canvas id="zoo" class="zoo" role="img" aria-label="Груповий портрет" hidden></canvas>`;
  el.querySelectorAll("[data-nb]").forEach(r => r.onclick = e => {
    const o = +r.dataset.nb, a = e.target.dataset ? e.target.dataset.a : "";
    if (!a) { openNb = openNb === o ? 0 : o; return renderNb(); }
    if (a === "pat" || a === "kick") act("care", a, {owner: o});
    if (a === "date" || a === "fight") { lastResult = null; tab = "adv"; store.set("ks-tab", tab); act("adventure", null, {kind: a, with: o}); }
    if (a === "spar") { tab = "arena"; store.set("ks-tab", tab); act("spar", strat(), {with: o}); }
  });
  $("#zooBtn").onclick = async () => { const z = $("#zoo"); z.hidden = false; await draw(z, await frames("zoo_frames"), 4); };
}

function renderLog() {
  const j = S.journal || [];
  $("#view").innerHTML = j.length ? `<div class="journal">${j.map(e => `<div class="k-${e.kind}"><time>${e.ts}</time>${esc(e.text)}</div>`).join("")}</div>`
    : `<p class="empty muted">Тут з'явиться історія життя твого пета.</p>`;
}

/* ---------- glue ---------- */
async function refresh() {
  [S, L, T] = await Promise.all([api("/api/state"), api("/api/lists"), api("/api/tour")]);
  if (!$("#as").options.length) $("#as").innerHTML = Object.entries(L.humans).map(([id, n]) => `<option value="${id}">👤 ${esc(n)}</option>`).join("");
  $("#clock").textContent = `🕰 ${S.clock}`;
  renderPet(); renderTabs();
}
function place(pop) {  // keep the dropdown inside the screen (on phones the header wraps and buttons move left)
  pop.style.left = ""; pop.style.right = "0";
  const r = pop.getBoundingClientRect(), host = pop.offsetParent.getBoundingClientRect(), pad = 12;
  const vw = document.documentElement.clientWidth;
  if (r.left < pad) { pop.style.right = "auto"; pop.style.left = (pad - host.left) + "px"; }
  else if (r.right > vw - pad) { pop.style.right = (host.right - (vw - pad)) + "px"; }
}
function popup(btn, pop) {
  $(btn).onclick = e => {
    e.stopPropagation();
    document.querySelectorAll(".pop").forEach(p => { if (p !== $(pop)) p.hidden = true; });
    $(pop).hidden = !$(pop).hidden;
    if (!$(pop).hidden) place($(pop));
  };
}
popup("#setBtn", "#setPop");
document.addEventListener("click", e => { if (!e.target.closest(".menu")) document.querySelectorAll(".pop").forEach(p => p.hidden = true); });
$("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.t; store.set("ks-tab", tab); if (tab !== "arena") battle = null; renderTabs(); });
$("#npcs").onclick = () => { $("#setPop").hidden = true; act("npcs", 3); };
$("#world").onclick = () => { $("#setPop").hidden = true; act("world", ""); };
$("#theme").onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; };
$("#reset").onclick = e => {
  const b = e.currentTarget;
  if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Точно стерти все? Натисни ще раз"; setTimeout(() => { delete b.dataset.sure; b.textContent = "🧹 Почати спочатку"; }, 4000); return; }
  delete b.dataset.sure; b.textContent = "🧹 Почати спочатку"; $("#setPop").hidden = true; lastResult = null; battle = null; act("reset");
};
$("#as").onchange = () => { lastResult = null; battle = null; more = ""; openNb = 0; refresh(); };
/* ---------- boot ---------- */
function step(n, state) { const li = $("#st" + n); if (li) li.className = state; }
async function start(data) {
  try {
    step(1, "now");
    if (typeof WebAssembly !== "object") throw new Error("Цей браузер не підтримує WebAssembly.");
    py = await loadPyodide({indexURL: new URL("pyodide/", location.href).href});
    step(1, "done"); step(2, "now");
    const files = JSON.parse($("#py-sources").textContent);
    for (const [path, text] of Object.entries(files)) {
      const full = "/home/pyodide/game/" + path;
      py.FS.mkdirTree(full.slice(0, full.lastIndexOf("/")));
      py.FS.writeFile(full, text);
    }
    py.runPython("import sys; sys.path.insert(0, '/home/pyodide/game')");
    bridge = py.pyimport("bridge");
    step(2, "done"); step(3, "now");
    let saved = (data && data.save) || "";
    if (!saved) { try { saved = localStorage.getItem(SAVE_KEY) || ""; } catch { saved = ""; } }
    const restored = await bridge.boot(saved);
    step(3, "done");
    window.claude?.hot?.snapshot?.(() => ({save: bridge.dump()}));
    await refresh();
    $("#loader").hidden = true;
    if (restored) toast("З поверненням! Гру відновлено.");
  } catch (e) {
    const err = $("#loadErr"); err.hidden = false;
    err.textContent = "Не вдалося запустити гру: " + (e && e.message ? e.message : e) +
      "\nСпробуй оновити сторінку або відкрити її в іншому браузері (Chrome, Firefox, Safari 16+).";
  }
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
