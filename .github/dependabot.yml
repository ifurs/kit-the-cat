version: 2
# a cooldown gives the ecosystem time to spot a compromised release before we pick it up
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # update uv.lock, and pyproject.toml only when a new version is outside its range
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
