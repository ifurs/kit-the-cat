# Release workflow. A release happens when a reviewed pull request that bumps `version` in pyproject.toml is merged
# into main: that version has no tag yet, so CI runs the full check suite on the merged commit, builds the sdist and
# wheel, creates the tag and the GitHub Release (with the files and a build-provenance attestation) and deploys the
# browser build to GitHub Pages. Nobody pushes tags by hand. Docs: docs/RELEASING.md. Model: dexus-vault.
#
# There is deliberately no workflow_dispatch: a manual run could release another branch. To retry a failed release,
# re-run its failed jobs; they reuse the same build artifacts, so the Release and Pages carry what was tested.
name: release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether to release
    # defense in depth: only main is ever released
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # checkout, read tags
      pull-requests: read   # find the merged PR of this commit
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: plan
        name: Compare the package version with existing tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(python3 -I scripts/release_meta.py version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # only a reviewed, merged PR releases; a direct push to main that bumps the version stops here
          merged=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          if [ "$merged" = "0" ]; then
            echo "::error::$SHA bumps the version to $version but is not the merge of a PR into main"
            exit 1
          fi
          # the bump PR must carry the changelog section and the README pin; fail before anything is built
          python3 -I scripts/release_meta.py notes "$version" > /dev/null
          python3 -I scripts/release_meta.py check "$version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "### Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Full check suite on the merged commit
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml

  build:
    name: Build distributions and the Pages site
    needs: [plan, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # checkout only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # no cache in release builds, so nothing written by other runs ends up in them
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - name: Build sdist + wheel (reproducible from the commit time)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          uv build
          ls dist/
          test -f "dist/kit_the_cat-$VERSION-py3-none-any.whl"
          test -f "dist/kit_the_cat-$VERSION.tar.gz"
      - name: Wheel installs and imports without optional deps
        run: |
          uv venv --python 3.12 /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/python -I -c "import kit_the_cat.engine as E; print(len(E.EVENTS), 'events')"
      - name: Assemble the browser build (scripts/deploy_pages.py --dry-run, no git, no push)
        run: uv sync --locked && uv run python scripts/deploy_pages.py --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site/

  github-release:
    name: Tag, attest and create the GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the tag and the release
      id-token: write       # keyless signing of the attestation
      attestations: write   # store the build-provenance attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the tag and release on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          python3 -I scripts/release_meta.py notes "$VERSION" > notes.md
          if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$REPO" --clobber
          else
            # --target makes GitHub create the tag on exactly the commit that was tested and built
            gh release create "$tag" dist/* --repo "$REPO" --target "$SHA" --title "$tag" --notes-file notes.md \
              --latest
          fi
          {
            echo "Released [$tag](https://github.com/$REPO/releases/tag/$tag)."
            echo
            echo "Hosts: koshenyat's Dependabot (group \`kit\`, no cooldown) opens the pin-bump PR at its next run;"
            echo "to get it now: koshenyat → Insights → Dependency graph → Dependabot → Check for updates."
          } >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: Deploy the browser build to GitHub Pages
    needs: [plan, github-release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write          # deploy
      id-token: write       # verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # PyPI Trusted Publishing — disabled. To enable: docs/RELEASING.md § PyPI (create the `pypi` environment, register
  # this repo + workflow file `release.yml` + environment `pypi` as a trusted publisher on PyPI, then set the repo
  # variable PYPI_PUBLISH=true). No API token is ever stored. Trusted publishing is bound to this file name.
  publish-to-pypi:
    name: Publish to PyPI (disabled until PYPI_PUBLISH=true)
    needs: [plan, build, github-release]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/kit-the-cat
    permissions:
      id-token: write       # trusted publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # a retried release must not fail on files PyPI already has
          skip-existing: true
