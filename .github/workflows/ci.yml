name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check src scripts tests web
      - run: uv run python -m kit_the_cat.content.validate
      - run: uv run pytest -q
      - name: core has no third-party imports
        run: uv run python scripts/build_web.py --tree --no-runtime && cd build/web-py && python3 -I -S -c "import sys; sys.path.insert(0,'.'); import bridge"
