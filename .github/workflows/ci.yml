name: ci
on:
  push:
  pull_request:
  # release.yml runs the same suite on the merged commit before it tags anything
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check src scripts tests web
      - run: uv run python -m kit_the_cat.content.validate
      - run: uv run python scripts/gen_dsl_docs.py --check
      - run: uv run python scripts/ua_lint.py --strict
      - run: uv run python scripts/content_stats.py --strict --gaps
      - run: uv run pytest -q
      - run: uv run python scripts/balance.py --pets 16 --days 45
      - run: uv run python scripts/preview.py --smoke
      - name: core has no third-party imports
        run: uv run python scripts/build_web.py --tree --no-runtime && cd build/web-py && python3 -I -S -c "import sys; sys.path.insert(0,'.'); import bridge"
